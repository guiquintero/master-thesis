# Deploy local — usa o Ollama instalado no host da máquina do utilizador.
# Uso: docker compose -f docker-compose.local.yml up
#
# Pré-requisitos:
# 1) `ollama serve` rodando no host
# 2) `ollama pull qwen3:8b` (ou modelo escolhido em .env)

version: "3.9"

services:
  api:
    build: .
    image: consultavet-api:2.0.0
    container_name: consultavet-api-local
    env_file:
      - .env
    environment:
      APP_MODE: docker
      # host.docker.internal funciona no Docker Desktop (mac/win) e no Linux ≥ 20.10
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./pdf_cache_otimizado:/app/pdf_cache_otimizado
      - ./data:/app/data

  web:
    image: nginx:alpine
    container_name: consultavet-web-local
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
