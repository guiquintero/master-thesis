# Deploy "servidor" — orquestra app + Ollama + servidor web estático.
# Uso: docker compose up -d
#
# Para deploy local sem container, ver `docker-compose.local.yml`
# ou o Makefile (target `make local`).

version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: consultavet-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: .
    image: consultavet-api:2.0.0
    container_name: consultavet-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: docker
      OLLAMA_HOST: http://ollama:11434
      API_HOST: 0.0.0.0
      API_PORT: 5000
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./pdf_cache_otimizado:/app/pdf_cache_otimizado
      - ./data:/app/data

  web:
    image: nginx:alpine
    container_name: consultavet-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  ollama_data:
